<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MarioGame</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            touch-action: none;
        }
        canvas {
            width: 100%;
            height: 75vh;
            object-fit: contain;
            background-color: #111;
        }
        #mobile-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            height: 25vh;
            padding: 10px 30px;
            background-color: black;
            align-items: center;
        }
        .control-group {
            display: flex;
            gap: 20px;
        }
        .game-btn {
            width: 60px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.3);
            border: 2px solid white;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .game-btn:active {
            background-color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <canvas></canvas>

    <div id="mobile-controls">
        <div class="control-group">
            <button class="game-btn" id="btn-left">◀</button>
            <button class="game-btn" id="btn-right">▶</button>
        </div>
        <div class="control-group">
            <button class="game-btn" id="btn-jump">▲</button>
        </div>
    </div>
</body>
</html>
