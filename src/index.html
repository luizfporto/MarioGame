<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MarioGame</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #111;
        }
        /* Botões flutuantes sobre o jogo */
        #mobile-controls {
            position: fixed;
            bottom: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            pointer-events: none; /* Deixa o toque passar onde não tem botão */
            z-index: 10;
        }
        .control-group {
            display: flex;
            gap: 15px;
            pointer-events: auto; /* Reativa o toque nos botões */
        }
        .game-btn {
            width: 65px;
            height: 65px;
            background-color: rgba(255, 255, 255, 0.35);
            border: 2px solid white;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }
        .game-btn:active {
            background-color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <canvas></canvas>

    <div id="mobile-controls">
        <div class="control-group">
            <button class="game-btn" id="btn-left">◀</button>
            <button class="game-btn" id="btn-right">▶</button>
        </div>
        <div class="control-group">
            <button class="game-btn" id="btn-jump">▲</button>
        </div>
    </div>
</body>
</html>
