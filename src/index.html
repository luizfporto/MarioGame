<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MarioGame</title>
    <style>
        body {
            margin: 0;
            background-color: black;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            width: 100%;
            max-width: 800px;
            height: auto;
            object-fit: contain;
        }
        /* Estilo dos botões mobile */
        #mobile-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            padding: 15px 20px;
            box-sizing: border-box;
            background-color: rgba(0, 0, 0, 0.8);
        }
        .control-group {
            display: flex;
            gap: 20px;
        }
        .game-btn {
            width: 65px;
            height: 65px;
            background-color: rgba(255, 255, 255, 0.25);
            border: 2px solid white;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .game-btn:active {
            background-color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>
    <canvas></canvas>

    <!-- Botões virtuais para celular -->
    <div id="mobile-controls">
        <div class="control-group">
            <button class="game-btn" id="btn-left">◀</button>
            <button class="game-btn" id="btn-right">▶</button>
        </div>
        <div class="control-group">
            <button class="game-btn" id="btn-jump">▲</button>
        </div>
    </div>
</body>
</html>
